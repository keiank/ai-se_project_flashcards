<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Keian Kaserman" />
    <meta
      name="description"
      content="A modern flashcard application for the web."
    />
    <meta
      name="keywords"
      content="flashcard, study aid, cram, test preparation"
    />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/index.css" />
    <title>Flash Cards</title>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li>
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="gallery__list_wrapper">
          <ul class="gallery__list gallery__list_wrapper_display_contents"></ul>
          <button
            class="gallery__new-card-btn"
            type="button"
            aria-label="Create a new flashcard deck"
          >
            + New Deck
          </button>
        </div>
      </section>
      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button
            class="gallery__practice-btn"
            aria-label="Practice flashcards in this deck"
            type="button"
          >
            Practice
          </button>
        </div>
        <div class="gallery__list_wrapper">
          <ul class="gallery__list gallery__list_wrapper_display_contents"></ul>
          <button
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
            type="button"
            aria-label="Create a new card"
          >
            + New Card
          </button>
        </div>
      </section>
      <section id="carousel" class="carousel">
        <h2 class="carousel__title"></h2>
        <div class="carousel__card-wrapper">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Go to previous card in deck"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Go to next card in deck"
          ></button>
          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip the card to view the backside"
          ></button>
        </div>
      </section>
      <section id="new-deck-view"></section>
      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; Keian Kaserman</p>
    </footer>

    <div
      id="confirmation-modal"
      class="modal"
      aria-modal="true"
      role="alertdialog"
      aria-label="Confirm deletion modal"
    >
      <div class="modal__container">
        <p class="modal__text"></p>
        <div class="modal__buttons">
          <button type="button" class="modal__btn modal__btn_type_cancel">
            Cancel
          </button>
          <button type="button" class="modal__btn modal__btn_type_confirm">
            Delete
          </button>
        </div>
      </div>
    </div>

    <template class="card-template">
      <li class="card card_color_green">
        <a href="#" class="card__link"></a>
        <h3 class="card__title"></h3>
        <div class="card__row">
          <p class="card__count"></p>
          <button
            class="card__delete-btn"
            aria-label="Delete this deck"
            type="button"
          ></button>
        </div>
      </li>
    </template>
    <template class="flashcard-template">
      <li class="card card_color_green">
        <h3 class="card__title"></h3>
        <div class="card__row">
          <button
            class="card__flip-btn"
            aria-label="Flip this flashcard to see the other side of it"
          ></button>
          <button
            class="card__delete-btn"
            aria-label="Delete this card"
            type="button"
          ></button>
        </div>
      </li>
    </template>
    <script src="assets/js/index.js" type="module"></script>
  </body>
</html>
